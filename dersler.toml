# Ders kaydı — sitenin tek bilgi kaynağı.
#
# Her [[ders]] bloğu bir Sphinx projesidir. Ana sayfa, tema ve PDF başlık
# sayfası bilgilerini buradan alır. Yeni ders eklemek için bir blok ekleyin
# ve dersin conf.py dosyasında `yapilandir(globals(), "<kimlik>")` çağırın.
#
#   kimlik     : URL'de kullanılan kısa ad (site/<kimlik>/)
#   kaynak     : conf.py dosyasının bulunduğu klasör (depo köküne göre)
#   ad         : dersin adı
#   alt_baslik : kartta ve PDF kapağında adın altındaki satır
#   hoca       : dersin öğretim üyesi/üyeleri
#   yil        : öğretim yılı
#   sube       : sınıf/şube
#   sinif      : ana sayfada gruplama için sınıf numarası
#   latex_ust  : PDF'de en üst bölüm düzeyi; dönem sayfaları varsa "part"

[site]
baslik = "Hukuk Ders Notları"
alt_baslik = "Ankara Üniversitesi Hukuk Fakültesi"
aciklama = "Ankara Üniversitesi Hukuk Fakültesi derslerine ait öğrenci ders notları; her ders için web sürümü ve PDF."
pdf_uyari = "Bu belge öğrenci tarafından tutulan ders notlarından oluşur; Ankara Üniversitesi'nin veya öğretim üyelerinin resmî yayını değildir. Hatalar bulunabilir; sınavlara hazırlanırken asıl kaynaklara başvurun."
uyari = "Bu site öğrenci tarafından tutulan ders notlarından oluşur; Ankara Üniversitesi'nin veya öğretim üyelerinin resmî yayını değildir. Hatalar bulunabilir; sınavlara hazırlanırken asıl kaynaklara başvurun."

